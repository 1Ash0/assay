name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Typecheck, tests (real-corpus tests skip: the corpus is never in the repo) and schema drift.
      - run: pnpm check
  assert-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action on a scripted fixture, to show it running; real sessions stay local.
      - uses: ./
        with:
          paths: fixtures/scripted/cost-state.jsonl
          rules: assay.rules.example.json
      # The gate must also close: this fixture has a broken request seal (D11).
      - id: broken
        uses: ./
        continue-on-error: true
        with:
          paths: fixtures/scripted/requests/sc-req.jsonl
          rules: assay.rules.example.json
      - if: steps.broken.outcome != 'failure'
        run: echo "assay assert passed a run with a broken seal" && exit 1
